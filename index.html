<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="flex flex-col min-h-screen">
    <header>
      <input
        type="text"
        placeholder="Enter Movie Name"
        id="input"
        class="input"
      />
      <button onclick="search()" id="searchBtn" class="searchBtn">
        Search
      </button>
    </header>
    <div class="hero hidden">
      <div class="left">
        <p id="title"></p>
        <p id="desc"></p>
        <br />
        <p id="year"></p>
        <p id="rated"></p>
        <p id="released"></p>
        <p id="genre"></p>
        <p id="director"></p>
        <p id="actor"></p>
        <p id="award"></p>
        <p id="language"></p>
        <p id="rating"></p>
      </div>
      <img src="" alt="movieposter" class="poster" />
    </div>
    <p class="error text-4xl text-center"></p>
    <p
      class="text-center bg-black text-white w-[250px] border mb-2 m-auto py-2 px-4 rounded-lg fixed bottom-0 left-1/2 transform -translate-x-1/2"
    >
      Created by Akshay Gawde
    </p>
    <script src="script.js"></script>
  </body>
</html>
